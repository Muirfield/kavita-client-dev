# Value-provider registry (docs/TODO-schemathesis.md, phase 2).
#
# `values` maps spec parameter names (camelCase, as they appear in the
# OpenAPI document) to keys in the canary stack state's `providers`
# section, populated by `schemathesis_stack.py --populate`.
# `static` holds fixed strings applied without a running stack.
# The hooks module (schemathesis_hooks.py) injects both into generated
# cases; the canary script re-includes from the Q26/Q27/Q28 buckets any
# operation whose parameters are fully provider-covered.

values:
  seriesId: series_id
  chapterId: chapter_id
  volumeId: volume_id
  libraryId: library_id
  userId: user_id
  apiKey: api_key
  query: query
  tzId: tz_id

static:
  fileExtension: '.cbz'
  code: 'en'
  cronExpression: '0 0 * * *'

# Ops whose parameters are provider-covered but whose semantics the
# providers cannot fix (Kavita+ gating, pending-user-only state,
# covers not yet generated, OPDS content negotiation, entity-kind
# mismatches). The canary subtracts these from the re-include set.
no-provider:
  - path: /api/Account/invite-url
    method: get
  - path: /api/Account/resend-confirmation-email
    method: post
  - path: /api/Book/{chapterId}/book-info
    method: get
