quirks:
  # --- fix-dependent: fixed in the released client, excluded on nightly ---
  - id: Q01
    title: invite returns an object where the spec declares a string
    category: fix-dependent
    fix_id: F1
    endpoints:
      - {path: /api/Account/invite, method: post}
    schemathesis: exclude-nightly
    covered_by: [tests/integration/test_invite.py]
    status: open
    note: >
      The three media types all declare {type: string}; the server sends
      InviteUserResponse. Upstream issue Kareadita/Kavita#4934 covers
      this class.
  - id: Q02
    title: nullable enum fields declared non-nullable
    category: fix-dependent
    fix_id: F2
    endpoints:
      - {path: /api/Series/v2, method: post}
      - {path: /api/Settings/metadata-settings, method: get}
      - {path: /api/Tachiyomi/latest-chapter, method: get}
    schemathesis: exclude-nightly
    covered_by:
      - tests/integration/test_media.py
      - tests/integration/test_sweep.py
      - tests/integration/test_small_families.py
    status: open
    note: >
      Endpoint list covers the curated ops whose responses carry the
      nullable DTOs; the Schemathesis prototype triage may extend it.
  - id: Q03
    title: bare text bodies where JSON-ish media types are declared
    category: fix-dependent
    fix_id: F3
    endpoints: []
    schemathesis: include
    covered_by:
      - tests/integration/test_auth.py
      - tests/integration/test_invite.py
      - tests/integration/test_media.py
      - tests/integration/test_sweep.py
      - tests/integration/test_email.py
    status: open
    note: >
      No exclusion: the raw spec declares text/plain + string schema and
      the server sends exactly that, so Schemathesis validates fine (the
      JSON crash was client-side only).
  - id: Q05
    title: file-breakdown returns an object where the spec declares an array
    category: fix-dependent
    fix_id: F5
    endpoints:
