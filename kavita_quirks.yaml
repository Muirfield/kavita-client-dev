# Kavita quirks registry — single source of truth for:
#
# 1. `fix_spec.py` patch data (the `fixes` section — fix_spec reads it),
# 2. the Schemathesis exclusion lists (generated per mode from `quirks`),
# 3. the docs' quirk facts (DESIGN.md prose references these ids).
#
# `schemathesis` per quirk: `exclude-both` (dead quirks, destructive ops),
# `exclude-nightly` (fix-dependent: the raw dev spec still carries the
# bug), `include` (resolved, or mock-pinned network ops).
# `covered_by` is `module.py::test_name` or a module path; `[]` = a
# declared known gap (excluded here AND not covered elsewhere).
#
# Categories: dead-quirk | destructive | fix-dependent | stateful-id |
# undocumented-auth | server-error-on-garbage | schema-mismatch |
# resolved | infra
#
# `runner` (optional): the Schemathesis runner consults it for
# schema-wide tolerances (e.g. `lenient-date-time` for Q29a/Q29b).

fixes:
  - id: F1
    title: invite response is an object, not a string
    endpoints:
      - {path: /api/Account/invite, method: post}
  - id: F2
    title: nullable enum fields
    fields:
