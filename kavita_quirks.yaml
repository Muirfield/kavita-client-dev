      - {schema: ChapterDto, field: format}
      - {schema: MetadataSettingsDto, field: filterAboveWeight}
      - {schema: TachiyomiChapterDto, field: format}
  - id: F3
    title: bare (non-JSON) string response bodies
    endpoints:
