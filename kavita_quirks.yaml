  - id: Q29a
    title: date-time fields carry 7 fractional seconds (.NET ticks)
    category: schema-mismatch
    endpoints: []
    schemathesis: include
    runner: lenient-date-time
    covered_by: []
    status: open
    note: >
      Schema-wide: the server serializes DateTime with 7-digit fractions,
      but format: date-time (RFC 3339) allows at most 3. Found by the
      Schemathesis prototype; the runner installs a lenient checker.
  - id: Q29b
    title: empty date-times serialized as 0001-01-01T00:00:00
    category: schema-mismatch
    endpoints: []
    schemathesis: include
    runner: lenient-date-time
    covered_by: []
    status: open
    note: >
      Schema-wide MinValue leak (DateTime.MinValue instead of null);
      tolerated by the runner's lenient checker.

